spring:
  application:
    name: gfn-control-plane
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
    cassandra:
      contact-points: ${CASSANDRA_CONTACT_POINTS:localhost}
      port: ${CASSANDRA_PORT:9042}
      keyspace-name: ${CASSANDRA_KEYSPACE:gfn_control_plane}
      local-datacenter: ${CASSANDRA_LOCAL_DATACENTER:datacenter1}
      schema-action: NONE
      username: ${CASSANDRA_USERNAME:}
      password: ${CASSANDRA_PASSWORD:}

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true

control-plane:
  reservation-ttl-seconds: 45
  reconcile-interval-ms: 5000
  heartbeat-timeout-seconds: 20
  idempotency-claim-ttl-seconds: 600
  queue-claim-ttl-seconds: ${CONTROL_PLANE_QUEUE_CLAIM_TTL_SECONDS:30}
  auth:
    client-token: ${CONTROL_PLANE_CLIENT_TOKEN:dev-client-token}
    node-token: ${CONTROL_PLANE_NODE_TOKEN:dev-node-token}
    admin-token: ${CONTROL_PLANE_ADMIN_TOKEN:dev-admin-token}
  rate-limit:
    client-create-session-per-minute: ${CONTROL_PLANE_CLIENT_CREATE_SESSION_RATE_LIMIT_PER_MINUTE:60}
