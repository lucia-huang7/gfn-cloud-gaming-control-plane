apiVersion: apps/v1
kind: Deployment
metadata:
  name: gfn-control-plane
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gfn-control-plane
  template:
    metadata:
      labels:
        app: gfn-control-plane
    spec:
      containers:
        - name: control-plane
          image: gfn-control-plane:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: REDIS_HOST
              value: redis
            - name: CASSANDRA_CONTACT_POINTS
              value: cassandra
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: gfn-control-plane
spec:
  selector:
    app: gfn-control-plane
  ports:
    - port: 8080
      targetPort: 8080
