services:
  control-plane:
    build: ./control-plane-service
    ports:
      - "8080:8080"
    environment:
      REDIS_HOST: redis
      CASSANDRA_CONTACT_POINTS: cassandra
      CASSANDRA_LOCAL_DATACENTER: datacenter1
      CONTROL_PLANE_CLIENT_TOKEN: dev-client-token
      CONTROL_PLANE_NODE_TOKEN: dev-node-token
      CONTROL_PLANE_ADMIN_TOKEN: dev-admin-token
    depends_on:
      redis:
        condition: service_started
      cassandra-schema:
        condition: service_completed_successfully

  redis:
    image: valkey/valkey:7.2
    ports:
      - "6379:6379"

  cassandra:
    image: cassandra:4.1
    ports:
      - "9042:9042"
    environment:
      CASSANDRA_CLUSTER_NAME: gfn-control-plane
      CASSANDRA_DC: datacenter1
      CASSANDRA_ENDPOINT_SNITCH: GossipingPropertyFileSnitch
    healthcheck:
      test: ["CMD-SHELL", "cqlsh localhost 9042 -e 'DESCRIBE CLUSTER' >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12

  cassandra-schema:
    image: cassandra:4.1
    depends_on:
      cassandra:
        condition: service_healthy
    volumes:
      - ./deploy/cassandra/local:/migrations:ro
    entrypoint: ["/bin/bash", "-lc"]
    command: >
      "until /opt/cassandra/bin/cqlsh cassandra 9042 -e 'DESCRIBE CLUSTER'; do
        echo waiting for cassandra;
        sleep 5;
      done;
      /opt/cassandra/bin/cqlsh cassandra 9042 -f /migrations/001_session_events_local.cql"
